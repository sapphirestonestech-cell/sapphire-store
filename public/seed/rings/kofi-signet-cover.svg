<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="kofi-signet cover">
  <title>kofi-signet — cover</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="85%">
      <stop offset="0" stop-color="#fdfbf7"/>
      <stop offset="1" stop-color="#ebe3d6"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF1F4"/>
      <stop offset="0.45" stop-color="#B9C0C7"/>
      <stop offset="1" stop-color="#7E878F"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B9C0C7"/>
      <stop offset="1" stop-color="#7E878F"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eaf1f6"/>
      <stop offset="1" stop-color="#c9d7e2"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecdcc9"/>
      <stop offset="0.5" stop-color="#f3e7d8"/>
      <stop offset="1" stop-color="#e0cdb5"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#211d19" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#211d19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="720" rx="240" ry="52" fill="url(#shadow)"/>
  
  <g transform="translate(400 520)" stroke-linejoin="round" stroke-linecap="round">
    
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#metal)" stroke-width="30"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" stroke-dasharray="26 400" stroke-dashoffset="18" opacity="0.5"/>
        <rect x="-74" y="-198" width="148" height="106" rx="52" fill="url(#metal)"/>
        <ellipse cx="0" cy="-148" rx="40" ry="30" fill="#211d19" opacity="0.12"/>
        <circle cx="0" cy="-148" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  </g>
