<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="liora-twist-band detail">
  <title>liora-twist-band — detail</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="85%">
